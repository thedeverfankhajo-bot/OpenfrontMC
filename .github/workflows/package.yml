name: Package API 5 plugin and world

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/package.yml"
      - "composer.json"
      - "plugin.yml"
      - "resources/**"
      - "src/**"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP build tools
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: sqlite3, yaml
          coverage: none
          tools: composer:v2

      - name: Validate and test source
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --prefer-dist --no-progress
          find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
          composer test
          composer analyse

      - name: Build OpenFrontMC PHAR
        run: bash tools/build-phar.sh dist/OpenFrontMC.phar

      - name: Install official PocketMine-MP API 5 runtime
        run: bash tools/install-pocketmine.sh "$RUNNER_TEMP/pocketmine"

      - name: Generate and verify LevelDB world pack
        run: bash tools/build-world-pack.sh "$RUNNER_TEMP/pocketmine" dist

      - name: Package PocketMine-MP runtime
        run: |
          mkdir -p "$RUNNER_TEMP/pocketmine-runtime/plugins"
          cp "$RUNNER_TEMP/pocketmine/PocketMine-MP.phar" "$RUNNER_TEMP/pocketmine-runtime/"
          cp "$RUNNER_TEMP/pocketmine/start.sh" "$RUNNER_TEMP/pocketmine-runtime/"
          cp -a "$RUNNER_TEMP/pocketmine/bin" "$RUNNER_TEMP/pocketmine-runtime/"
          cp dist/OpenFrontMC.phar "$RUNNER_TEMP/pocketmine-runtime/plugins/"
          cp "$RUNNER_TEMP/pocketmine/server.properties" "$RUNNER_TEMP/pocketmine-runtime/"
          tar -czf dist/PocketMine-MP-API5-Linux-x86_64.tar.gz -C "$RUNNER_TEMP/pocketmine-runtime" .

      - name: Upload installable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenFrontMC-API5-Ready
          path: |
            dist/OpenFrontMC.phar
            dist/OpenFrontMC-WorldPack.zip
            dist/PocketMine-MP-API5-Linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 30
